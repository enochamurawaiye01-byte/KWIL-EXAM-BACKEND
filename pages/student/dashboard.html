<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — KWIL Examination System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/reset.css" />
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/student.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body class="page-shell">
  <header id="navbar-root"></header>

  <main class="container" style="padding-block: var(--space-6);">
    <div class="welcome-card" id="welcome-card">
      <div class="skeleton" style="height:28px; width:220px; grid-column:1/-1;"></div>
      <div class="skeleton" style="height:40px;"></div>
      <div class="skeleton" style="height:40px;"></div>
      <div class="skeleton" style="height:40px;"></div>
    </div>

    <section>
      <div class="section-heading">
        <h2>Assigned courses</h2>
      </div>
      <div id="courses-region">
        <div class="loader"><span class="loader__spinner"></span> Loading your courses…</div>
      </div>
    </section>
  </main>

  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/notifications.js"></script>
  <script src="../../js/student/_layout.js"></script>
  <script src="../../js/student/dashboard.js"></script>
</body>
</html>
