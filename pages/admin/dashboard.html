<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — KWIL Examination System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/reset.css" />
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/admin.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body class="admin-shell">
  <aside id="sidebar-root"></aside>

  <main class="admin-main">
    <header id="topbar-root"></header>

    <div class="stat-grid" id="stat-grid">
      <div class="stat-card"><div class="stat-card__label">Total students</div><div class="stat-card__value" id="stat-students">—</div></div>
      <div class="stat-card"><div class="stat-card__label">Total courses</div><div class="stat-card__value" id="stat-courses">—</div></div>
      <div class="stat-card"><div class="stat-card__label">Active exams</div><div class="stat-card__value" id="stat-active-exams">—</div></div>
      <div class="stat-card"><div class="stat-card__label">Completed exams</div><div class="stat-card__value" id="stat-completed-exams">—</div></div>
      <div class="stat-card"><div class="stat-card__label">Pass rate</div><div class="stat-card__value" id="stat-pass-rate">—</div></div>
    </div>
  </main>

  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/notifications.js"></script>
  <script src="../../js/admin/_layout.js"></script>
  <script src="../../js/admin/dashboard.js"></script>
</body>
</html>
